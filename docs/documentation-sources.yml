      les données personnelles qu'il contient (non reproduites), mais non
      commenté paragraphe par paragraphe conformément au périmètre du Lot
      7 ; css/custom.css (334 lignes, taille confirmée, non lu ligne à
      ligne) ; bibliothèque vendorisée Leaflet (JS/CSS/images, présence
      confirmée, code non audité — bibliothèque tierce hors périmètre de
      ce dépôt).
    perimetre: >
      Audit complet pour la rubrique 06.projet-gites (Lot 7) : cinq
      chronologies (construction de l'image, premier démarrage,
      redémarrage/mise à jour, parcours d'un visiteur, développement/test/
      publication), comparaison architecturale avec
      projet-lavallee-website, audit détaillé du routage du formulaire de
      contact (falsification du champ caché "gite" confirmée en direct),
      audit des données personnelles, matrice de classification des
      fichiers, inventaire éditorial. Remplace et étend l'audit ciblé du
      Lot 2 (mécanisme de chaînage de thème quark2 uniquement).
    perimetre_correction_sec_gites_001: >
      Travail réalisé directement dans projet-gites (jamais dans ce
      dépôt), en plusieurs étapes tracées : préflight (analyse seule,
      trois stratégies comparées) ; vérification expérimentale invalidant
      la stratégie A (contexte serveur non discriminant, le formulaire
      poste toujours vers /contact quelle que soit la fiche d'origine) ;
      stratégie C (jeton signé) étudiée puis écartée par décision de
      l'opérateur du dépôt (complexité disproportionnée à l'impact) ;
      stratégie D retenue et implémentée (sélection visible et
      obligatoire, table serveur unique) ; trois rounds de durcissement
      (réservation de l'identifiant général, éligibilité stricte,
      validation d'adresse, collisions fermées indépendantes de l'ordre,
      rejet CR/LF applicatif) ; suite de tests étendue à 60 assertions
      nommées, vérifiée capable de détecter la régression sur le code
      pré-correctif ; AUDIT FIX-GITES-R1 (lecture de code indépendante du
      commit avant fusion, worktree détaché dédié) ; correction d'un
      défaut mineur de nettoyage de fichiers temporaires de test,
      découvert par cet audit ; fusion via une pull request, CI distante
      observée verte sur la fusion et sur la publication du tag v1.1.0 ;
      audit final (Lot 9) au tag publié, incluant la vérification directe
      de l'image GHCR par digest et par étiquette de révision, et le
      rejeu des contrôles ciblés contre cette même image tirée du
      registre.
    note: >
      Écart historique constaté au commit b27d7af (Lot 7), conservé ici
      pour mémoire avec sa chronologie établie depuis l'historique Git
      (lecture seule) — **résolu depuis dans le tag v1.1.0**, voir la
      suite de ce champ : docs/compatibility-policy.md certifiait
      grav-runtime 1.0.2 comme seule version compatible connue depuis la
      création du dépôt (2026-07-25), jamais mis à jour depuis, alors que
      le Dockerfile référençait grav-runtime:1.0.4 dès le 2026-08-05 — la
      propre politique de certification du dépôt n'avait pas été suivie. De
      même, quatre fichiers de ce dépôt référençaient systématiquement
      "ansible-role-grav-site:1.0.1" depuis la même date d'origine, une
      version différente du tag v2.0.0 déjà audité au Lot 4 — le tag
      v1.0.1 existe réellement et avait été vérifié ponctuellement pour ce
      lot (worktree détaché temporaire, supprimé après lecture) :
      l'exemple documenté était compatible avec v1.0.1 au moment de sa
      rédaction, et restait majoritairement compatible avec v2.0.0, à
      l'exception de grav_bind_address (devenu obligatoire depuis
      v2.0.0, absent de l'exemple à l'époque).
      **Résolution (tag v1.1.0)** : docs/compatibility-policy.md enregistre
      désormais une ligne "1.1.0" certifiant grav-runtime 1.0.4 (la
      version réellement construite), sur la base de la suite de tests de
      ce même chantier ; les quatre fichiers citant
      "ansible-role-grav-site:1.0.1" référencent désormais "v2.0.0", avec
      grav_bind_address ajouté explicitement à l'exemple de déploiement —
      compatibilité vérifiée statiquement contre le code et le guide de
      migration du rôle, **aucun déploiement Ansible réel exécuté** pour
      cette vérification. **Dette documentaire résiduelle constatée dans
      le tag publié v1.1.0** (non corrigée par ce lot, ni par
      grav-platform-docs, qui ne modifie jamais projet-gites) :
      docs/compatibility-policy.md qualifie encore la ligne "1.1.0" de
      "proposée — non encore taguée", et docs/security-notes.md qualifie
      encore SEC-GITES-001 de "en attente de release" avec un "numéro de
      version corrigée : à déterminer" — ces deux formulations étaient
      exactes au moment de leur rédaction (avant la création du tag) mais
      sont désormais factuellement dépassées dans le tag publié lui-même ;
      le tag v1.1.0 ne doit jamais être déplacé pour les corriger
      rétroactivement, une correction éventuelle relève d'une version
      ultérieure de projet-gites. Le commit
      documenté à l'origine (b27d7af) restait daté du 2026-08-23 ; une métadonnée
      d'infrastructure historique (un nom d'hôte SMTP réel, sans
      identifiant ni mot de passe associé) a été trouvée référencée dans
      tests/test-secrets.sh comme garde de non-régression contre une fuite
      passée déjà corrigée — nom non reproduit dans cette documentation
      publique. Un constat de sécurité (SEC-GITES-001, routage du
      formulaire de contact contrôlé par une donnée transmise par le
      client) a été confirmé en environnement de test au commit b27d7af,
      puis corrigé et publié dans le tag v1.1.0 (voir publication
      ci-dessus) : le champ devient une sélection visible et obligatoire,
      résolue exclusivement depuis une table serveur unique — voir la
      rubrique, page "Référence", pour la fiche de synthèse mise à jour
      (statut, chronologie complète de la correction, limites du constat
      d'origine). La procédure de reproduction complète du constat
      d'origine reste conservée hors de ce dépôt, dans un rapport de
      sécurité privé non public (voir private_security_report ci-dessous)
      — la documentation publique n'en présente qu'une fiche de synthèse,
      sans détail exploitable, y compris après correction. Deux données
      personnelles réelles (adresses postales et coordonnées GPS précises
      de deux gîtes, et un passage rédactionnel à la première personne)
      sont présentes dans le contenu du dépôt et n'ont volontairement pas
      été reproduites dans cette documentation — inchangé par la
      correction, qui ne touche pas ce contenu éditorial.
    private_security_report:
      id: SEC-GITES-001
      status: corrected-and-published-v1.1.0
      sha256: e5448d1ee8e60a4432fadc315ac2fbfde1615d7f6bba80441bbc0c99e3c6f181
      public_content: sanitized-summary-only
      note: >
        Le rapport privé reste entièrement hors de ce dépôt, hors de
        projet-gites, et hors de toute image Docker — seul son SHA-256
        est enregistré ici, jamais son chemin local. Mis à jour à chaque
        étape de la correction (préflight, implémentation, durcissements,
        AUDIT FIX-GITES-R1, audit final au tag v1.1.0) ; le SHA-256
        ci-dessus correspond à son état après l'audit final.

