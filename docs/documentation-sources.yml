      corps complet des pages d'études de cas et des articles techniques
      (structure, frontmatter, liens et médias vérifiés ; prose éditoriale
      non commentée paragraphe par paragraphe, conformément au périmètre
      du Lot 6) ; contenu détaillé de css/custom.css (410 lignes, taille
      et présence confirmées, non lu ligne à ligne).
    perimetre: >
      Audit complet pour la rubrique 05.projet-lavallee-website (Lot 6) :
      cinq chronologies (construction de l'image, premier démarrage,
      redémarrage, soumission du formulaire, développement et publication),
      matrice de classification des fichiers, inventaire éditorial et
      multilingue, audit comportemental du formulaire de contact en
      conditions réelles. Remplace et étend l'audit ciblé du Lot 2 (mécanisme
      du formulaire de contact uniquement, cahier §10).
    note: >
      Aucun identifiant SMTP ni mot de passe n'est versionné. Les adresses
      d'expéditeur et de fallback (contact@lavallee.tech, from/to) sont en
      revanche présentes en clair dans grav/user/config/plugins/email.yaml
      — configuration non secrète du dépôt de référence, non reprise ici :
      grav-platform-docs utilise des adresses provisoires non fonctionnelles
      (contact@example.invalid). Écarts constatés lors de l'audit complet,
      documentés dans la rubrique 05.projet-lavallee-website/11.reference :
      lien LinkedIn du footer sans schéma https:// (cassé) ; sujet et corps
      de l'e-mail de contact toujours en français quelle que soit la langue
      du visiteur ; article "MFA/Keycloak" sans published_label dans les 3
      langues (et, en DE/EN, une chaîne non booléenne assignée à la clé
      réservée `published`) ; un dossier d'article sans préfixe numérique
      (grav-plateforme-de-deploiement-reutilisable) ; deux pages
      auto-déclarées incomplètes par le dépôt lui-même (mentions légales,
      réalisation facturation) — transparence du dépôt source, pas une
      découverte. Confirmé en direct : la validation anti-XSS et
      anti-injection d'en-tête du formulaire est assurée par Grav Core, pas
      par ce dépôt ; le honeypot n'est qu'un filtre partiel, pas une
      protection anti-spam complète.

