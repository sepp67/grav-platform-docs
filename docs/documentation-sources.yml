      version différente du tag v2.0.0 déjà audité au Lot 4 — le tag
      v1.0.1 existe réellement et a été vérifié ponctuellement pour ce
      lot (worktree détaché temporaire, supprimé après lecture) :
      l'exemple documenté était compatible avec v1.0.1 au moment de sa
      rédaction, et reste majoritairement compatible avec v2.0.0, à
      l'exception de grav_bind_address (devenu obligatoire depuis
      v2.0.0, absent de l'exemple). Le commit
      documenté (b27d7af) est lui-même daté du 2026-08-23 ; l'état actuel
      du dépôt au-delà de ce commit n'a pas été revérifié. Une métadonnée
      d'infrastructure historique (un nom d'hôte SMTP réel, sans
      identifiant ni mot de passe associé) a été trouvée référencée dans
      tests/test-secrets.sh comme garde de non-régression contre une fuite
      passée déjà corrigée — nom non reproduit dans cette documentation
      publique. Un constat de sécurité (SEC-GITES-001, routage du
      formulaire de contact contrôlé par une donnée transmise par le
      client) a été confirmé en environnement de test ; sa procédure de
      reproduction complète est conservée hors de ce dépôt, dans un
      rapport de sécurité privé non public (voir
      private_security_report ci-dessous) — la documentation publique
      n'en présente qu'une fiche de synthèse, sans détail exploitable.
      Deux données personnelles réelles (adresses postales et coordonnées
      GPS précises de deux gîtes, et un passage rédactionnel à la première
      personne) sont présentes dans le contenu du dépôt et n'ont
      volontairement pas été reproduites dans cette documentation.
    private_security_report:
      id: SEC-GITES-001
      status: retained-outside-public-repository
      sha256: 23ad766c385e4def7ab491a95d4d5fde263806b5f0b0d0a277a75ff25c69f691
      public_content: sanitized-summary-only

