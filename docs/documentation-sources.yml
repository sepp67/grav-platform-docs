# Manifeste des sources documentées par grav-platform-docs.
#
# Champs par dépôt : url, reference (branche ou tag), commit (SHA complet),
# date_audit (ISO 8601), perimetre (ce qui a réellement été inspecté à ce
# stade — le Lot indiqué documentera le reste), note (écart ou clarification
# constaté lors de l'audit).
#
# Toute affirmation technique publiée sur ce site doit être traçable à l'une
# des entrées ci-dessous. Aucun de ces cinq dépôts n'a été modifié pour
# produire ce manifeste (cahier §3 et §15).

depots_documentes:
  - nom: grav-runtime
    url: https://github.com/sepp67/grav-runtime
    reference: v1.0.4
    commit: e6e35c37bce2d214b4fb2ca77549f7bec7eed3d4
    date_audit: "2026-09-12"
    perimetre: >
      Audit complet du tag v1.0.4 pour le Lot 3 (rubrique grav-runtime),
      réalisé via un worktree Git détaché sur le tag (dépôt source non
      modifié) : Dockerfile intégral, docker/entrypoint.sh,
      docker/seed-init.sh, docker/bootstrap-admin.sh, docker/healthcheck.sh,
      docker/healthz.php, docker/nginx.conf, docker/php-fpm.conf,
      docker/theme-overrides/quark2/, README.md intégral (487 lignes),
      .github/workflows/docker.yml, test/config/system.yaml,
      test/seed/pages/. Complété par une vérification empirique directe :
      build local du tag (tag distinct "grav-runtime:v1.0.4-audit-local",
      jamais publié), démarrage, healthcheck, les trois cas de la politique
      tri-state du bootstrap admin, cycle seed/redémarrage/non-écrasement,
      UID/GID www-data, et interrogation en direct du registre GHCR
      (docker manifest inspect) et de l'historique GitHub Actions
      (gh run list/view) pour les tags OCI réellement publiés. Non
      ré-exécutés : tests GRAV_ADMIN_TYPE (3quater-3septies), non-écrasement
      d'un compte existant (3octies), arrêt propre (7), arrêt inattendu de
      PHP-FPM (8) — voir la rubrique elle-même, page "Tests et CI".
    note: >
      Le tag Git v1.0.4 correspond au tag OCI publié "1.0.4" (sans le
      préfixe "v") sur ghcr.io/sepp67/grav-runtime, conformément au workflow
      docker.yml (déclenché sur push de tag "vX.Y.Z", tags OCI dérivés par
      docker/metadata-action à partir du tag Git sans préfixe). La branche
      main est 9 commits en avance sur ce tag au moment de l'audit (README
      réécrit, plus court) et n'est donc pas documentée :
      projet-lavallee-website, seule image applicative de référence
      disponible, est elle-même construite sur "grav-runtime:1.0.4", pas sur
      main. Écarts constatés lors de l'audit complet, documentés dans la
      rubrique : test/compose.yml référencé par le README mais absent du
      tag (gitignored) ; commentaire du Dockerfile renvoyant à un
      docker/theme-overrides/README.md inexistant ; le workflow publie
      aussi un tag OCI "latest" (confirmé en direct sur le registre) alors
      que le contrat d'utilisation l'interdit en production.

  - nom: ansible-role-grav-site
    url: https://github.com/sepp67/ansible-role-grav-site
    reference: v2.0.0
    commit: 1339e50bc20257fbb9f21953995c08262ae3043e
    date_audit: "2026-09-12"
    perimetre: >
      Audit complet du tag v2.0.0 (Lot 4, complété au Lot 4.1), réalisé
      via un worktree Git détaché sur le tag (dépôt source non modifié).
      Lot 4 : README.md intégral (579 lignes), CHANGELOG.md (entrée 2.0.0),
      meta/main.yml, defaults/main.yml, vars/main.yml, tous les fichiers de
      tasks/ (main.yml, assert.yml, admin_guard.yml, docker.yml,
      verify_docker.yml, directories.yml, secrets.yml, deploy.yml,
      healthcheck.yml, clear_failure_diagnostic.yml,
      verify_admin_account.yml, version.yml), templates/docker-compose.yml.j2,
      .github/workflows/ci.yml, inventories/example/, examples/site.yml.example.
      Lot 4.1, sources supplémentaires lues intégralement : docs/MIGRATION.md,
      docs/CONFORMITE-REQ.md (63 exigences REQ-*), docs/TEST-RESULTS.md
      (matrice T01-T23), playbooks/check.yml, playbooks/deploy.yml,
      restart.yml, stop.yml, Makefile, requirements.yml,
      templates/grav.env.j2, templates/deployed_state.yml.j2,
      molecule/*/molecule.yml (5 scénarios), molecule/*/converge.yml
      (5 scénarios), molecule/deploy/prepare.yml, molecule/install/verify.yml,
      tests/test_assertions.yml (comptage exact : 46 scénarios),
      tests/test_consume_via_requirements.yml (en-tête et logique).
      Complété par l'observation en direct de l'historique GitHub Actions
      (gh run list/view) pour le run ayant publié le tag v2.0.0 (8 jobs,
      tous success, 33888725974), et par l'exécution locale réelle (Lot
      4.1) de : ansible-lint (commande exacte du README/Makefile, 0
      échec/0 avertissement), ansible-playbook --syntax-check sur les 4
      playbooks, ansible-inventory sur l'inventaire d'exemple, et 7
      playbooks de tests/ sans Docker (test_assertions.yml,
      test_traceability.yml, test_failure_log_lifecycle.yml,
      test_admin_guard.yml, test_persistence_untouched.yml,
      test_no_secret_leak.yml, test_consume_via_requirements.yml — tous
      PASS). Non lus en détail : les fichiers verify.yml des scénarios
      Molecule autres qu'install, les fichiers tests/_*.yml (helpers
      partagés). Non exécutés : Molecule (non installé dans l'environnement
      d'audit), les tests fonctionnels nécessitant Docker natif ou un
      déploiement réel (test.yml, test_env_encoding.yml,
      test_standalone.yml) — voir la rubrique, page "Tests et CI", pour la
      distinction exacte entre comportement lu dans le code, test présent,
      test exécuté, et CI observée.
    note: >
      Aucun écart majeur constaté entre README, contrat et code pour le
      périmètre audité (contrairement à grav-runtime) : la séquence décrite
      par README "Ce que fait le rôle" correspond exactement à
      tasks/main.yml et aux fichiers qu'il importe. Deux écarts de
      précision trouvés au Lot 4.1 : (1) le README annonce "~35 scénarios"
      pour tests/test_assertions.yml alors que le code et
      docs/TEST-RESULTS.md en comptent 46 (confirmé par exécution réelle) ;
      (2) docs/TEST-RESULTS.md documente le run CI T04-T08 sur le commit
      105e085 (branche refonte/lot-9-release-preparation), antérieur au
      commit du tag v2.0.0 lui-même — sa section "Run final du HEAD
      définitif" est un espace réservé non rempli. Le run propre au tag
      (33888725974, observé en direct par ce Lot) est vert sur ses 8 jobs,
      mais son détail n'est pas consigné dans docs/TEST-RESULTS.md. Une
      première version de ce Lot avait imprécisément décrit
      tasks/admin_guard.yml comme "sauté si grav_state == stopped" dans son
      ensemble, puis, en 4.1, comme ayant "ses tâches d'observation
      s'exécutant toujours" — corrigé une seconde fois avec le détail
      exact : le stat sur grav_accounts_directory s'exécute toujours ; le
      find n'est joué que si ce stat constate un répertoire existant de
      type directory ; le calcul de _grav_admin_account_present s'exécute
      toujours (avec default(0) si le find a été sauté) ; le calcul de
      _grav_admin_bootstrap_count s'exécute toujours ; seule l'assertion
      finale ("compte présent ou bootstrap complet") porte
      when: grav_state != 'stopped'. La validation tri-state (assert.yml)
      s'applique même à l'état stopped. De même, grav_digest n'est pas lu
      "uniquement" par vars/main.yml : defaults/main.yml (définition),
      tasks/assert.yml (validation de forme), vars/main.yml (calcul de
      _grav_effective_reference), templates/deployed_state.yml.j2
      (écriture du champ) et tasks/version.yml (comparaison à l'état
      précédent) le lisent tous directement, chacun pour un usage propre.

